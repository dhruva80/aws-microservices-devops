
name: Microservices CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout GitHub repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Debug GitHub OIDC claims
      - name: Debug OIDC claims
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF"
          
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2 | tr '_-' '/+' | base64 -d 2>/dev/null)

          echo "$PAYLOAD" | jq '{iss, aud, sub, repository, ref, environment}'

      # Step 3: Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::451971655895:role/GitHubActionsECRRole
          aws-region: eu-north-1

      # Step 4: Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Step 5: Build and push User Service
      - name: Build and push User Service
        run: |
          docker build -t user-service ./user-service
          docker tag user-service:latest 451971655895.dkr.ecr.eu-north-1.amazonaws.com/user-service:latest
          docker push 451971655895.dkr.ecr.eu-north-1.amazonaws.com/user-service:latest

      # Step 6: Build and push Product Service
      - name: Build and push Product Service
        run: |
          docker build -t product-service ./product-service
          docker tag product-service:latest 451971655895.dkr.ecr.eu-north-1.amazonaws.com/product-service:latest
          docker push 451971655895.dkr.ecr.eu-north-1.amazonaws.com/product-service:latest

      # Step 7: Build and push Order Service
      - name: Build and push Order Service
        run: |
          docker build -t order-service ./order-service
          docker tag order-service:latest 451971655895.dkr.ecr.eu-north-1.amazonaws.com/order-service:latest
          docker push 451971655895.dkr.ecr.eu-north-1.amazonaws.com/order-service:latest
